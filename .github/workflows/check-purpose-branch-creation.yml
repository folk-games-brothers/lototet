name: check-purpose-branch-creation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-branch-purpose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changed files against branch purpose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Branch: $BRANCH"
          echo "Changed files:"
          echo "$changed_files"

          case "$BRANCH" in
            docs/*)
              invalid="$(echo "$changed_files" | grep -Ev '(^|/).*\.md$|^docs/' || true)"
              if [ -n "$invalid" ]; then
                echo "docs/* branch may only change documentation files."
                echo "$invalid"
                exit 1
              fi
              ;;
            release/*)
              invalid="$(echo "$changed_files" | grep -Ev '^(package\.json|package-lock\.json|CHANGELOG\.md|VERSION|release/)' || true)"
              if [ -n "$invalid" ]; then
                echo "release/* branch may only change release/version files."
                echo "$invalid"
                exit 1
              fi
              ;;
            chore/*)
              invalid="$(echo "$changed_files" | grep -Ev '^(\.github/|package\.json|package-lock\.json|\.gitignore|\.editorconfig|scripts/)' || true)"
              if [ -n "$invalid" ]; then
                echo "chore/* branch should only change repository configuration or maintenance files."
                echo "$invalid"
                exit 1
              fi
              ;;
            *)
              echo "No strict file restriction for branch prefix: $BRANCH"
              ;;
          esac

          echo "Branch purpose check passed."
